name: Build CBT Kiosk (Windows)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  KIOSK_PROJECT: src/CbtKiosk/CbtKiosk.csproj
  SETUP_PROJECT: src/CbtKioskSetup/CbtKioskSetup.csproj
  TEST_PROJECT: tests/LogicTest/LogicTest.csproj
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---------------------------------------------------------------- kiosk
      - name: Publish kiosk (self-contained single-file EXE)
        run: >
          dotnet publish ${{ env.KIOSK_PROJECT }}
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      # --------------------------------------------------------- settings app
      - name: Publish settings app (self-contained single-file EXE)
        run: >
          dotnet publish ${{ env.SETUP_PROJECT }}
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      # ------------------------------------------------------------ self-check
      - name: Run logic tests
        # The tests call the live CBT endpoint, so a network hiccup must not fail the release.
        continue-on-error: true
        run: dotnet run --project ${{ env.TEST_PROJECT }} -c Release

      - name: Verify the executables exist
        shell: pwsh
        run: |
          $required = @('publish/win-x64/CbtKiosk.exe', 'publish/win-x64/CbtKioskSetup.exe')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Berkas hasil build tidak ditemukan: $file" }
            $size = [math]::Round((Get-Item $file).Length / 1MB, 1)
            Write-Host "$file -> $size MB"
          }

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/win-x64/CbtKiosk.exe dist/
          Copy-Item publish/win-x64/CbtKioskSetup.exe dist/
          Copy-Item README.md dist/README.md
          Copy-Item docs/PANDUAN-PENGAWAS.md dist/PANDUAN-PENGAWAS.md
          Get-ChildItem dist

      # ------------------------------------------------------------ signature
      # Releases are cut for tags (vX.Y.Z), for pushes to master/main, and for manual
      # runs. The auto-generated tag is derived from the COMMIT (v<version>-<short sha>),
      # never from the run number: GitHub occasionally fires two runs for one push, and a
      # commit-based tag makes those collapse into a single release instead of duplicates.
      - name: Determine release version, tag and names
        id: meta
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content '${{ env.SETUP_PROJECT }}')
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }).Trim()
          $sha = '${{ github.sha }}'.Substring(0, 7)

          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $tag = '${{ github.ref_name }}'
            $name = "CBT Kiosk $tag"
            $prerelease = 'false'
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $tag = "v$version-pr${{ github.event.pull_request.number }}-$sha"
            $name = "CBT Kiosk v$version (uji PR #${{ github.event.pull_request.number }})"
            $prerelease = 'true'
          } else {
            $tag = "v$version-$sha"
            $name = "CBT Kiosk v$version ($sha)"
            $prerelease = 'false'
          }

          "version=$version"       >> $env:GITHUB_OUTPUT
          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "name=$name"             >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version tag=$tag name=$name prerelease=$prerelease"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CbtKiosk-win-x64-v${{ steps.meta.outputs.version }}
          path: dist/

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath CbtKiosk-win-x64-${{ steps.meta.outputs.version }}.zip -Force

      - name: Generate release notes
        shell: pwsh
        run: |
          @"
          Aplikasi Windows untuk ujian CBT (mode kios) — siswa fokus pada ujian.

          **Berkas yang tersedia**
          | Berkas | Fungsi |
          |---|---|
          | ``CbtKiosk.exe`` | Aplikasi ujian (mode kios). Dijalankan siswa. |
          | ``CbtKioskSetup.exe`` | **Aplikasi pengaturan baru** — atur URL, password, dan auto-start tanpa console. |
          | ``CbtKiosk-win-x64-*.zip`` | Kedua berkas di atas + README + panduan pengawas. |

          **Cara pakai singkat**
          1. Salin kedua ``.exe`` ke folder yang sama, mis. ``C:\CbtKiosk\``.
          2. Klik kanan ``CbtKioskSetup.exe`` → **Run as administrator**, lalu isi URL ujian & password. Klik **Tes koneksi**, lalu **Simpan**.
          3. Klik **Jalankan CBT Kiosk** (atau dua klik ``CbtKiosk.exe``) untuk memulai mode ujian.

          **Baru di versi ini**
          - **Password darurat (offline) sekarang punya nilai bawaan** = ``smkdata2026``. Komputer baru
            langsung bisa dibuka walau server mati — tidak perlu setting apa pun lebih dulu.
          - **Password darurat tetap berlaku walau password online KEDALUWARSA.** Sebelumnya aplikasi
            berhenti dengan pesan *"password kedaluwarsa"* dan pengawas tidak bisa keluar; sekarang
            password darurat offline langsung dipakai sebagai jalan keluar.
          - Password darurat juga jadi jaring pengaman terakhir saat server hidup (server tetap
            diutamakan: password online diperiksa lebih dulu).
          - Bawaan otomatis **berhenti berlaku** begitu pengawas menyimpan password darurat sendiri,
            dan dapat **dimatikan total** lewat centang di tab *Keamanan & Penguncian*.
          - Aplikasi pengaturan kini menampilkan password darurat mana yang sedang berlaku
            (sendiri / bawaan pabrik / tidak ada) dan punya opsi **"tampilkan password"**.
          - Aplikasi pengaturan grafis (``CbtKioskSetup.exe``) menggantikan ``CbtKiosk.exe --settings`` dari console.
          - Tab Umum / Keamanan / Startup / Bantuan, tombol **Tes koneksi**, **Periksa startup**, **Jalankan CBT Kiosk**, dan pendeteksi lokasi ``CbtKiosk.exe``.
          - Auto-start dari aplikasi pengaturan menunjuk ke ``CbtKiosk.exe`` (bukan ke aplikasi pengaturan).

          ``CbtKiosk.exe --settings`` tetap bisa dipakai bila diperlukan.

          Lihat ``PANDUAN-PENGAWAS.md`` untuk panduan lengkap.
          "@ | Set-Content -Path release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          files: |
            CbtKiosk-win-x64-${{ steps.meta.outputs.version }}.zip
            dist/CbtKiosk.exe
            dist/CbtKioskSetup.exe
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
